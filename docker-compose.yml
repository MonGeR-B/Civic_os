services:
  db:
    image: postgis/postgis:15-3.3
    container_name: civic_db
    environment:
      POSTGRES_USER: civic_admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: civic_os_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic_admin -d civic_os_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civic_queue
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: